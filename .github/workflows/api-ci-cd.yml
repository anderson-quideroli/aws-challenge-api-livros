name: API-LIVROS-CI-CD

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - '**/README.md'

env:
  AWS_REGION: us-east-1                # Ajuste se necessário
  ECR_REPOSITORY: api-livros           # Nome do repositório ECR
  CONTAINER_NAME: api-task             # Nome do container na task definition
  ECS_CLUSTER: api-cluster             # Nome do cluster ECS
  ECS_SERVICE: api-service             # Nome do serviço ECS
  CODEDEPLOY_APP: api-livros-codedeploy
  CODEDEPLOY_GROUP: api-livros-deployment-group

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt
          pip install ruff

      - name: Lint with ruff
        run: |
          ruff check --select=E9,F63,F7,F82 --target-version=py37 .
          ruff check --target-version=py37 .

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      ecr_image: ${{ steps.build-image.outputs.ecr_image }}
    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG .
          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG
          echo "ecr_image=$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG" >> $GITHUB_OUTPUT

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.CONTAINER_NAME }} \
            --query taskDefinition > task-definition.json

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ needs.build.outputs.ecr_image }}

      - name: Register new task definition
        id: register_task_def
        run: |
          new_task_def_arn=$(aws ecs register-task-definition \
            --cli-input-json file://${{ steps.render-task-def.outputs.task-definition }} \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "task_def_arn=$new_task_def_arn" >> $GITHUB_OUTPUT

      - name: Update AppSpec file with new Task Definition ARN and Container Name
        run: |
          sed -i "s|<TASK_DEFINITION_ARN>|${{ steps.register_task_def.outputs.task_def_arn }}|g" appspec.yaml
          sed -i "s|<CONTAINER_NAME>|${{ env.CONTAINER_NAME }}|g" appspec.yaml

      - name: Deploy with CodeDeploy (Blue/Green)
        run: |
          APPSPEC_CONTENT=$(cat appspec.yaml | base64 | tr -d '\n')
          aws deploy create-deployment \
            --application-name ${{ env.CODEDEPLOY_APP }} \
            --deployment-group-name ${{ env.CODEDEPLOY_GROUP }} \
            --revision revisionType=AppSpecContent,appSpecContent={content=$APPSPEC_CONTENT} \
            --deployment-config-name CodeDeployDefault.ECSAllAtOnce